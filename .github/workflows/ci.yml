name: CI

# Runs on every push and PR to main — proves the pipeline's models,
# tests, and DAG code are actually valid on a clean environment, not
# just "it works on my machine."
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint Python (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ruff
        run: pip install ruff

      # Lints the Airflow DAGs and the mock API — catches unused
      # imports, undefined names, and style issues before they'd
      # ever reach a real deployment.
      - name: Run ruff
        run: ruff check dags/ mock-orders-api/

  dag-validation:
    name: Validate Airflow DAG imports
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Airflow
        run: pip install apache-airflow==2.10.2 psycopg2-binary

      # Imports every DAG file directly and fails if any raises an
      # exception (syntax errors, bad imports, broken top-level
      # code) — the same check Airflow's scheduler does on parse,
      # just running in CI before the code ever reaches the DAG folder.
      - name: Check for DAG import errors
        run: |
          python -c "
          import sys
          from airflow.models import DagBag
          dagbag = DagBag(dag_folder='dags/', include_examples=False)
          if dagbag.import_errors:
              for filename, error in dagbag.import_errors.items():
                  print(f'Import error in {filename}:\n{error}')
              sys.exit(1)
          print(f'{len(dagbag.dags)} DAG(s) imported successfully, no errors.')
          "

  dbt-test:
    name: dbt run + test
    runs-on: ubuntu-latest
    needs: lint

    # Spins up a real Postgres instance as a service container,
    # scoped to this job only — dbt connects to it over localhost,
    # runs the actual models, then runs the actual tests. This is
    # the same mechanics as your local setup, just ephemeral.
    services:
      postgres:
        image: postgres:13
        env:
          POSTGRES_USER: airflow
          POSTGRES_PASSWORD: airflow
          POSTGRES_DB: airflow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U airflow"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dbt
        run: pip install dbt-postgres==1.11.0

      # CI-specific profiles.yml — connects to the Postgres service
      # container above via localhost, distinct from both your local
      # host profile (localhost:5434) and the container-internal one
      # used by Airflow (postgres:5432).
      - name: Write CI profiles.yml
        run: |
          mkdir -p ~/.dbt
          cat > ~/.dbt/profiles.yml << 'EOF'
          orders_dbt:
            outputs:
              dev:
                type: postgres
                host: localhost
                port: 5432
                user: airflow
                pass: airflow
                dbname: airflow
                schema: dbt_orders
                threads: 4
            target: dev
          EOF

      # dbt models read from raw_orders/raw_customers, which in the
      # real pipeline are populated by the load_raw_data Airflow task.
      # In CI there's no Airflow run, so we seed minimal fixture data
      # directly — just enough for dbt run/test to have real rows to
      # work against.
      - name: Seed minimal test data
        run: |
          PGPASSWORD=airflow psql -h localhost -U airflow -d airflow << 'EOF'
          CREATE TABLE IF NOT EXISTS raw_orders (
              order_id INTEGER PRIMARY KEY,
              customer_id INTEGER NOT NULL,
              amount NUMERIC NOT NULL,
              order_date TIMESTAMP NOT NULL,
              status TEXT NOT NULL
          );
          CREATE TABLE IF NOT EXISTS raw_customers (
              customer_id INTEGER PRIMARY KEY,
              customer_name TEXT NOT NULL,
              region TEXT NOT NULL,
              segment TEXT NOT NULL
          );
          INSERT INTO raw_customers VALUES
              (1, 'Test Customer A', 'North America', 'Retail'),
              (2, 'Test Customer B', 'Europe', 'Enterprise');
          INSERT INTO raw_orders VALUES
              (1, 1, 100.00, '2026-01-01 00:00:00', 'completed'),
              (2, 2, 250.00, '2026-01-02 00:00:00', 'completed');
          EOF

      - name: dbt run
        working-directory: ./orders_dbt
        run: dbt run

      - name: dbt test
        working-directory: ./orders_dbt
        run: dbt test